version: '3.9'

services:
  db:
    image: postgres:16-alpine
    container_name: land-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: land_verification
      POSTGRES_USER: landuser
      POSTGRES_PASSWORD: landpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: land-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - db
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    container_name: land-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  postgres_data:
